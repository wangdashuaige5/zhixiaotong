name: zhixiaotong-prod
services:
  db:
    image: mysql:8.0.43
    environment:
      MYSQL_DATABASE: zhixiaotong
      MYSQL_USER: zhixiaotong
      MYSQL_PASSWORD: ${DB_PASSWORD:?请设置数据库密码}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置独立root密码}
      TZ: Asia/Shanghai
    command: ["--log-bin=mysql-bin", "--binlog-expire-logs-seconds=604800"]
    volumes: ["prod_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.2.10-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置Redis密码}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["prod_redis:/data"]
    restart: unless-stopped
  rabbit:
    image: rabbitmq:3.13.7-management
    environment:
      RABBITMQ_DEFAULT_USER: campus
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请设置RabbitMQ密码}
    volumes: ["prod_rabbit:/var/lib/rabbitmq"]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请设置对象存储账号}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请设置对象存储密码}
    volumes: ["prod_objects:/data"]
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_USER: ${MINIO_ACCESS_KEY:?请设置对象存储账号}
      MINIO_PASSWORD: ${MINIO_SECRET_KEY:?请设置对象存储密码}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set campus http://minio:9000 "$$MINIO_USER" "$$MINIO_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing campus/campus-private && mc anonymous set none campus/campus-private
    depends_on: [minio]
  clamav:
    image: clamav/clamav:1.4.3
    volumes: ["prod_virus:/var/lib/clamav"]
    restart: unless-stopped
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://db:3306/zhixiaotong?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true"
      DB_USER: zhixiaotong
      DB_PASSWORD: ${DB_PASSWORD:?请设置数据库密码}
      JWT_SECRET: ${JWT_SECRET:?请设置32字符以上随机JWT密钥}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请设置32字符以上独立随机加密密钥}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置Redis密码}
      RABBITMQ_HOST: rabbit
      RABBITMQ_USER: campus
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请设置RabbitMQ密码}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?请设置对象存储账号}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请设置对象存储密码}
      CLAMAV_HOST: clamav
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?请设置受信前端域名}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      rabbit: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
      clamav: {condition: service_started}
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports: ["8443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on: [app]
    restart: unless-stopped
volumes:
  prod_mysql:
  prod_redis:
  prod_rabbit:
  prod_objects:
  prod_virus:
