spring:
  datasource:
    url: jdbc:h2:mem:campus;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER;LOCK_TIMEOUT=15000
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
campus:
  jobs-enabled: false
  storage-path: ./target/test-files
logging:
  level:
    root: WARN
